[package]
name = "pixelferrite"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
base64 = "0.23.1"
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "links", "wayland", "web_screen_reader", "wgpu", "x11"] }
egui = "0.36.2"
egui-phosphor = "0.14.0"
epaint_default_fonts = "0.36.2"
fontdb = "0.24.0"
pf-core = { version = "0.1.0", path = "../pf-core" }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
ureq = "3.4.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(target_os = "linux")'.dependencies]
# Keep Wayland window titles while avoiding ab_glyph's unmaintained font parser.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland-dlopen", "wayland-csd-adwaita-crossfont"] }

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["wgpu", "eframe"] }
