name: Dependency advisories
on:
  push:
    paths: ['Cargo.lock', 'Cargo.toml', '**/Cargo.toml', '.github/workflows/dependencies.yml']
  pull_request:
    paths: ['Cargo.lock', 'Cargo.toml', '**/Cargo.toml', '.github/workflows/dependencies.yml']
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.98.0 --profile minimal
      - name: Install advisory checker
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Reject known vulnerabilities and unmaintained dependencies
        run: cargo audit --deny warnings
