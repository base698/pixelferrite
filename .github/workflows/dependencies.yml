name: Dependency advisories
on:
  push:
    branches: [main]
    paths: ['Cargo.lock', 'Cargo.toml', '**/Cargo.toml', '.github/workflows/dependencies.yml']
  pull_request:
    paths: ['Cargo.lock', 'Cargo.toml', '**/Cargo.toml', '.github/workflows/dependencies.yml']
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.98.0 --profile minimal
      - name: Install advisory checker
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Reject known vulnerabilities and unmaintained dependencies
        run: cargo audit --deny warnings
