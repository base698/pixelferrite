name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Linux graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfreetype6-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libegl1-mesa-dev libvulkan1 mesa-vulkan-drivers xvfb zenity
      - name: Core and application regressions (macOS)
        if: runner.os == 'macOS'
        run: cargo test --workspace --locked
      - name: Core and application regressions (Linux software GPU)
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
        run: xvfb-run -a cargo test --workspace --locked
      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        run: ./scripts/bundle-macos.sh --no-shortcut
